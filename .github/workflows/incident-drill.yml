name: Incident issue verification

on:
  push:
    branches: [ops/verify-incident-issues]
    paths: ['.github/workflows/incident-drill.yml', '.github/scripts/incident_drill.py']

permissions:
  contents: read
  issues: write

concurrency:
  group: incident-issue-drill

jobs:
  verify:
    if: github.repository == 'ZakJRademacher/magnificent-seven-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pandas yfinance exchange_calendars
      - name: Verify incident open, comment, and recovery with fixture prices
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: python .github/scripts/incident_drill.py
