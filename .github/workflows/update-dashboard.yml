name: Update live dashboard

# Production runs (schedule, manual, pushes to main) fetch prices, check them against the
# published history and the data contract, record the run on the `data` branch, open or
# close a pipeline incident, and deploy the site. Pull requests and pushes to other
# branches are dry runs against the live source: no ledger, no incidents, no deploy.
#
# Production and dry runs are separate jobs so that dry runs get read-only permissions and
# no saved credentials. Only the production job uses the `production` environment, whose
# secrets (the note's API key) are limited to the main branch in the repository settings.

on:
  schedule:
    - cron: "17 22 * * 1-5"   # weekdays, after the US market closes
  push:
    branches-ignore: [data]
  pull_request:
    branches: [main]
  workflow_dispatch:           # "Run workflow" button on the Actions tab
    inputs:
      accept_revisions:
        description: "Only after inspecting a blocked run: why the history changes are legitimate (logged)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'pages' || format('dry-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    # Production: schedule, manual runs and pushes on main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # record the run on the data branch
      issues: write     # open and close pipeline incidents
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true   # the run ledger is pushed to the data branch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pandas yfinance exchange_calendars

      - name: Check out the pipeline state (data branch)
        run: |
          if git fetch --depth=1 origin data:data 2>/dev/null; then
            git worktree add state data
          else
            git worktree add --orphan -b data state   # first run: bootstraps from data/
          fi

      - name: Run the pipeline
        id: run
        env:
          PYTHONPATH: src
          ACCEPT: ${{ github.event.inputs.accept_revisions }}
        run: |
          python -m m7.pipeline --state state --site site --record run.json --accept-revisions "$ACCEPT" || true
          status=$(python -c "import json, pathlib; p = pathlib.Path('run.json'); print(json.loads(p.read_text())['status'] if p.exists() else 'crashed')")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Pipeline status: $status"

      - name: Record the run on the data branch
        if: hashFiles('run.json') != ''
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "$(python -c "import json; r = json.load(open('../run.json')); print(f\"Run {r['run_id']}: {r['status']}, data as of {r['as_of']}\")")"
          git push origin HEAD:data

      - name: Open or close a pipeline incident
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: python -m m7.incident run.json

      - if: steps.run.outputs.status != 'crashed'
        uses: actions/configure-pages@v6
      - if: steps.run.outputs.status != 'crashed'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  dry-run:
    # Pull requests and pushes to other branches: the same pipeline against the live source,
    # bootstrapped from data/ in a throwaway state folder. Read-only, nothing recorded or deployed.
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pandas yfinance exchange_calendars

      - name: Run the pipeline (dry run)
        id: run
        env:
          PYTHONPATH: src
        run: |
          python -m m7.pipeline --state state --site site --record run.json || true
          status=$(python -c "import json, pathlib; p = pathlib.Path('run.json'); print(json.loads(p.read_text())['status'] if p.exists() else 'crashed')")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Pipeline status: $status"

  deploy:
    # Deploys on failures too: the site is rebuilt from the last good history,
    # and the status page needs to show the failure.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.status != 'crashed'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verdict:
    # Mark the workflow red when the pipeline failed, after the status page is deployed.
    # Exactly one of build and dry-run runs; take the status from whichever did.
    if: always()
    needs: [build, dry-run, deploy]
    runs-on: ubuntu-latest
    steps:
      - env:
          STATUS: ${{ needs.build.outputs.status || needs.dry-run.outputs.status }}
        run: |
          echo "Pipeline status: $STATUS"
          case "$STATUS" in published|degraded) exit 0 ;; *) exit 1 ;; esac

  # GitHub turns off scheduled workflows in public repos after 60 days without
  # repository activity. Re-enabling this workflow from inside its own scheduled
  # run resets that clock, so the daily refresh keeps going on quiet months.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-dashboard.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
