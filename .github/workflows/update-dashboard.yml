name: Update live dashboard

on:
  schedule:
    - cron: "17 22 * * 1-5"   # weekdays, after the US market closes
  push:
    branches: [main]
  pull_request:                # check the data build on PRs; never deploys
    branches: [main]
  workflow_dispatch:           # "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pandas yfinance
      - run: python refresh.py --no-chart
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub turns off scheduled workflows in public repos after 60 days without
  # repository activity. Re-enabling this workflow from inside its own scheduled
  # run resets that clock, so the daily refresh keeps going on quiet months.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-dashboard.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
