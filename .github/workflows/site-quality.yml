name: site-quality

on:
  workflow_run:
    workflows: [Update live dashboard]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ZakJRademacher/portfolio-ci/.github/workflows/site-quality.yml@e2365dabafc74c0cd450d1a9a4201f92ec17d518 # v1.0.0 + e2365da
    with:
      url: https://zakjrademacher.github.io/magnificent-seven-dashboard/
      paths: "/ status.html"
    secrets:
      blocked-names: ${{ secrets.PORTFOLIO_BLOCKED }}
      blocked-stems: ${{ secrets.PORTFOLIO_BLOCKED_STEMS }}
